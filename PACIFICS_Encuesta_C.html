<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACIFICS — Encuesta para empresas y responsables de seguridad</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b1f24;--muted:#5b6672;--line:#d6dce3;--accent:#1f5fbf;--accent-t:#fff;--err:#b3261e;--soft:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--card:#181d23;--text:#e8ebef;--muted:#9aa6b2;--line:#2b333c;--accent:#6ea3f0;--accent-t:#0b1626;--err:#ff8a80;--soft:#1e2a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:8px 0 12px}
.top h1{font-size:1.2rem;line-height:1.3;margin:0}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec h2{margin:0 0 8px;font-size:1.15rem}
.intro{white-space:pre-line;color:var(--muted);margin:0 0 16px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q.bad{border-left:3px solid var(--err);padding-left:12px}
.lbl{font-weight:600;margin-bottom:6px}
.star{color:var(--err)}
.help{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.info h3{margin:0 0 4px;font-size:1rem}
.info{background:var(--soft);border-radius:8px;padding:12px 14px;margin:8px 0;border-top:0}
.err{color:var(--err);font-size:.88rem;min-height:0}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt input{margin-top:5px;flex:none}
.opt.oo{align-items:center}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.oth{flex:1;min-width:0;padding:4px 8px!important}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scl{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:4px}
.gridwrap{overflow-x:auto}
.grid{border-collapse:collapse;min-width:100%}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:.88rem;font-weight:400;vertical-align:middle}
.grid th[scope=row]{text-align:left;min-width:200px}
.grid thead th{font-weight:600}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.btn{font:inherit;border:0;background:var(--accent);color:var(--accent-t);padding:10px 22px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:16px;text-align:center}
.foot a{color:var(--muted)}
table.adm{border-collapse:collapse;margin:8px 0}
.adm td{padding:4px 12px 4px 0}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Esta encuesta necesita JavaScript. / This survey needs JavaScript.</noscript>
<script>
(function(){
"use strict";
const DEF={"title":"PACIFICS — Encuesta para empresas y responsables de seguridad||PACIFICS — Survey for companies and security decision-makers","desc":"Estamos investigando cómo las organizaciones gestionan hallazgos de seguridad, qué procesos y herramientas usan, y cómo toman decisiones de compra. Duración estimada: 8–12 minutos. La participación es voluntaria; puedes omitir preguntas opcionales. NO escribas información confidencial (nombres de clientes, arquitectura interna, IP, credenciales, detalles de incidentes reales); no necesitamos el nombre de tu organización. Si no participas en compras, te llevaremos directamente al cierre. Las respuestas se analizan de forma agregada. Solo si lo aceptas al final, te pediremos un correo para invitarte a una conversación; se guarda aparte. Contacto: {{CONTACT}}||We are researching how organizations manage security findings, which processes and tools they use, and how they make purchasing decisions. Estimated time: 8–12 minutes. Participation is voluntary; you may skip optional questions. DO NOT write confidential information (client names, internal architecture, IPs, credentials, details of real incidents); we do not need your organization's name. If you do not take part in purchasing, we will take you straight to the end. Responses are analyzed in aggregate. Only if you agree at the end, we will ask for an email to invite you to a conversation; it is stored separately. Contact: {{CONTACT}}","confirm":"Gracias. Tus respuestas fueron registradas.||Thank you. Your responses have been recorded.","sections":[{"key":"C1","q":[{"k":"mc","id":"C00","t":"¿Tienes 18 años o más y aceptas participar?||Are you 18 or older, and do you agree to take part?","o":"Sí, tengo 18 años o más y acepto participar||Yes, I am 18 or older and I agree to take part;;No||No","req":1,"go":{"1":"SUBMIT"}}]},{"key":"C2","t":"Tu organización||Your organization","q":[{"k":"ls","id":"C01","t":"¿En qué país está la sede principal de tu organización (o donde trabajas principalmente)?||In which country is your organization headquartered (or where do you mainly work)?","o":"Argentina||Argentina;;Bolivia||Bolivia;;Brasil||Brazil;;Chile||Chile;;Colombia||Colombia;;Costa Rica||Costa Rica;;Cuba||Cuba;;Ecuador||Ecuador;;El Salvador||El Salvador;;Guatemala||Guatemala;;Honduras||Honduras;;México||Mexico;;Nicaragua||Nicaragua;;Panamá||Panama;;Paraguay||Paraguay;;Perú||Peru;;República Dominicana||Dominican Republic;;Uruguay||Uruguay;;Venezuela||Venezuela;;Otro país de América||Other country in the Americas;;Estados Unidos||United States;;Canadá||Canada;;España||Spain;;Reino Unido||United Kingdom;;Alemania||Germany;;Francia||France;;Italia||Italy;;Portugal||Portugal;;Otro país de Europa||Other European country;;India||India;;Otro país de Asia-Pacífico||Other Asia-Pacific country;;África y Medio Oriente||Africa and Middle East;;Prefiero no decir||Prefer not to say","req":1},{"k":"mc","id":"C02","t":"¿Cuántas personas trabajan en tu organización?||How many people work in your organization?","o":"1–10||1–10;;11–50||11–50;;51–200||51–200;;201–1.000||201–1,000;;1.001–5.000||1,001–5,000;;Más de 5.000||More than 5,000;;No sé||Don't know;;Prefiero no decir||Prefer not to say","req":1},{"k":"mc","id":"C03","t":"¿En qué sector está?||Which sector is it in?","o":"Financiero y seguros||Financial services and insurance;;Salud||Healthcare;;Gobierno||Government;;Tecnología y software||Technology and software;;Telecomunicaciones||Telecommunications;;Comercio y e-commerce||Retail and e-commerce;;Manufactura y energía||Manufacturing and energy;;Educación||Education;;Servicios profesionales||Professional services;;Otro||Other;;Prefiero no decir||Prefer not to say","req":1},{"k":"mc","id":"C04","t":"¿Qué tipo de organización es?||What type of organization is it?","o":"Empresa que usa seguridad para sí misma||Company running security for itself;;Consultora de seguridad o TI||Security or IT consultancy;;Proveedor de servicios gestionados (MSSP/MDR)||Managed service provider (MSSP/MDR);;Proveedor de productos de seguridad||Security product vendor;;Sector público||Public sector;;Otro||Other","req":1},{"k":"mc","id":"C05","t":"¿Cuál describe mejor tu cargo?||Which best describes your position?","o":"CISO / responsable de seguridad||CISO / head of security;;Gerente o jefe de seguridad||Security manager or lead;;Ingeniero/a o analista de seguridad||Security engineer or analyst;;Responsable de TI o infraestructura||IT or infrastructure lead;;Liderazgo de ingeniería, cloud o CTO||Engineering, cloud or CTO leadership;;Consultor/a de seguridad||Security consultant;;Compras, finanzas o legal||Procurement, finance or legal;;Otro||Other","req":1},{"k":"mc","id":"C06","t":"¿Cuántas personas se dedican a seguridad en tu organización?||How many people work on security in your organization?","o":"Nadie de forma dedicada||No one full time;;1–2||1–2;;3–10||3–10;;11–30||11–30;;Más de 30||More than 30;;No sé||Don't know","req":1},{"k":"cb","id":"C07","t":"¿Cómo se opera la seguridad? (marca todas las que apliquen)||How is security operated? (select all that apply)","o":"Equipo interno||In-house team;;SOC o MDR externo||External SOC or MDR;;Consultores puntuales||Occasional consultants;;Nadie en particular||No one in particular;;No sé||Don't know","req":1},{"k":"mc","id":"C08","t":"¿Cómo describirías la madurez de seguridad de tu organización?||How would you describe your organization's security maturity?","o":"Inicial: reactiva, procesos informales||Initial: reactive, informal processes;;Básica: controles esenciales||Basic: essential controls;;Definida: procesos documentados||Defined: documented processes;;Gestionada: se mide y se mejora||Managed: measured and improved;;Optimizada: mejora continua||Optimized: continuous improvement;;No sé||Don't know","req":1},{"k":"cb","id":"C09","t":"¿Qué proveedores cloud usa tu organización? (marca todos los que apliquen)||Which cloud providers does your organization use? (select all that apply)","o":"AWS||AWS;;Microsoft Azure||Microsoft Azure;;Google Cloud||Google Cloud;;Oracle Cloud||Oracle Cloud;;Solo infraestructura propia (on-premises)||On-premises only;;No sé||Don't know","other":1,"req":1},{"k":"mc","id":"C10","t":"¿Cómo llegaste a esta encuesta?||How did you find this survey?","o":"LinkedIn||LinkedIn;;Comunidad en línea (Discord, Slack, Telegram, Reddit…)||Online community (Discord, Slack, Telegram, Reddit…);;Mi universidad o institución||My university or institution;;Un colega o contacto||A colleague or contact;;Evento o conferencia||Event or conference;;Newsletter o medio especializado||Newsletter or specialist media;;Otro||Other;;Prefiero no decir||Prefer not to say"}]},{"key":"C3","t":"Herramientas y operación||Tools and operations","d":"Piensa en la situación real de tu organización, no en la ideal.||Think about your organization's real situation, not the ideal one.","q":[{"k":"cb","id":"C11","t":"¿Qué categorías de herramientas de seguridad usa tu organización? (marca todas las que apliquen)||Which categories of security tools does your organization use? (select all that apply)","o":"SIEM||SIEM;;EDR/XDR||EDR/XDR;;SOAR||SOAR;;Escáner de vulnerabilidades||Vulnerability scanner;;CSPM/CNAPP||CSPM/CNAPP;;IAM e identidad||IAM and identity;;Gestión de superficie de ataque (ASM)||Attack surface management (ASM);;Seguridad de aplicaciones||Application security;;Inteligencia de amenazas||Threat intelligence;;Gestión de tickets/incidentes||Ticketing/incident management;;Servicios nativos del proveedor cloud||Cloud-provider native services;;Herramientas open source||Open-source tools;;Scripts u hojas de cálculo propias||In-house scripts or spreadsheets;;No sé||Don't know","other":1,"req":1},{"k":"mc","id":"C12","t":"¿Cuántas herramientas distintas generan hallazgos o alertas de seguridad?||How many different tools generate security findings or alerts?","o":"1–3||1–3;;4–7||4–7;;8–15||8–15;;Más de 15||More than 15;;No sé||Don't know","req":1},{"k":"gr","id":"C13","t":"En tu organización, ¿qué tan serio es cada uno de estos problemas?||In your organization, how serious is each of these problems?","req":1,"r":"Herramientas que no se integran entre sí||Tools that do not integrate with each other;;Investigaciones manuales que consumen mucho tiempo||Time-consuming manual investigations;;Exceso de alertas o falsos positivos||Excess alerts or false positives;;Priorizar un volumen alto de vulnerabilidades||Prioritizing a high volume of vulnerabilities;;Entender la exposición real en cloud (identidades, permisos, datos)||Understanding real cloud exposure (identities, permissions, data);;Demostrar el impacto de negocio de un hallazgo||Demonstrating the business impact of a finding;;Verificar que una corrección redujo el riesgo||Verifying that a fix reduced risk;;Falta de personal o presupuesto||Lack of staff or budget;;Reunir evidencia para auditorías o reguladores||Gathering evidence for audits or regulators","c":"Problema grave||Serious problem;;Problema moderado||Moderate problem;;Problema menor||Minor problem;;No es un problema||Not a problem;;No sé||Don't know"},{"k":"mc","id":"C14","t":"Aproximadamente, ¿cuántas horas por semana dedica tu equipo, en total, a correlacionar manualmente hallazgos de distintas herramientas?||Roughly how many hours per week does your team spend in total manually correlating findings from different tools?","o":"Menos de 5||Fewer than 5;;5–20||5–20;;21–50||21–50;;Más de 50||More than 50;;No lo medimos||We don't measure it;;No sé||Don't know","req":1},{"k":"mc","id":"C15","t":"¿Miden el tiempo medio de detección (MTTD) y de respuesta (MTTR)?||Do you measure mean time to detect (MTTD) and respond (MTTR)?","o":"Medimos ambos||We measure both;;Solo MTTR||MTTR only;;Solo MTTD||MTTD only;;No medimos ninguno||We measure neither;;No sé||Don't know","req":1},{"k":"cb","id":"C16","t":"Cuando varias herramientas reportan hallazgos relacionados, ¿cómo se decide hoy la prioridad? (marca todas las que apliquen)||When several tools report related findings, how is priority decided today? (select all that apply)","o":"Decide una persona senior||A senior person decides;;Reglas definidas en SIEM o SOAR||Rules defined in SIEM or SOAR;;Una plataforma CNAPP o de gestión de exposición||A CNAPP or exposure management platform;;Hoja de cálculo o reunión||Spreadsheet or meeting;;Consultoría externa||External consultancy;;No hay un proceso definido||There is no defined process","other":1,"req":1},{"k":"mc","id":"C17","t":"En los últimos 12 meses, ¿hubo un incidente o casi-incidente donde la falta de contexto entre herramientas retrasó una decisión?||In the last 12 months, was there an incident or near-miss where lack of context between tools delayed a decision?","o":"Sí, varias veces||Yes, several times;;Sí, una vez||Yes, once;;No||No;;No sé||Don't know;;Prefiero no decir||Prefer not to say","req":1},{"k":"cb","id":"C18","t":"¿Cómo intentan resolver hoy el problema de relacionar hallazgos entre herramientas? (marca todas las que apliquen)||How do you currently try to solve the problem of relating findings across tools? (select all that apply)","o":"Funciones de las plataformas que ya tenemos||Features of platforms we already have;;Plataforma comercial CNAPP o de gestión de exposición||A commercial CNAPP or exposure management platform;;Herramientas open source||Open-source tools;;Scripts internos||Internal scripts;;Consultoría o servicios externos||Consulting or external services;;No hacemos nada específico||We do nothing specific","other":1,"req":1},{"k":"mc","id":"C19","t":"¿Qué tan bien cubre hoy su stack la necesidad de relacionar hallazgos entre herramientas?||How well does your current stack cover the need to relate findings across tools?","o":"Por completo||Completely;;En su mayor parte||Mostly;;Parcialmente||Partially;;Poco||Barely;;No la cubre||It does not cover it;;No sé||Don't know","req":1},{"k":"pg","id":"C20","t":"Opcional, sin datos confidenciales: describe la última vez que este problema consumió tiempo o recursos importantes.||Optional, no confidential data: describe the last time this problem consumed significant time or resources."}]},{"key":"C4a","t":"Una idea en evaluación||An idea under evaluation","d":"Ahora te presentamos una idea en etapa temprana. NO es un producto comercial disponible: existe solo un prototipo limitado sobre un escenario controlado de AWS. La idea es una plataforma que se conectaría a las herramientas de seguridad que ya usas para relacionar hallazgos (activos, identidades, permisos, vulnerabilidades, exposición y datos), mostrar posibles rutas de ataque con la evidencia de cada paso y apoyar la priorización y la verificación de correcciones. No reemplazaría tu SIEM, EDR ni escáner. Puede que no te resulte útil: tu opinión crítica es valiosa.||Here is an early-stage idea. It is NOT a commercially available product: only a limited prototype exists, built on a controlled AWS scenario. The idea is a platform that would connect to the security tools you already use to relate findings (assets, identities, permissions, vulnerabilities, exposure and data), show possible attack paths with evidence for each step, and support prioritization and verification of fixes. It would not replace your SIEM, EDR or scanner. It may not be useful to you: your critical opinion is valuable.","q":[{"k":"mc","id":"C21","t":"¿Qué tan relevante es para tu organización el problema que esta idea intenta resolver?||How relevant is the problem this idea tries to solve for your organization?","o":"Nada relevante||Not at all relevant;;Poco relevante||Slightly relevant;;Moderadamente relevante||Moderately relevant;;Bastante relevante||Very relevant;;Extremadamente relevante||Extremely relevant;;No es un problema para mí||It is not a problem for me;;No sé / No aplica||Don't know / Not applicable","req":1,"go":{"0":"C5","1":"C5","5":"C5"}}]},{"key":"C4b","t":"Requisitos y preferencias||Requirements and preferences","q":[{"k":"mc","id":"C22","t":"¿Cómo preferirías que se posicionara algo así?||How would you prefer something like this to be positioned?","o":"Una capa que complemente lo que ya tenemos||A layer that complements what we already have;;Una herramienta que reemplace parte de lo que tenemos||A tool that replaces part of what we have;;No necesitamos algo así||We do not need something like this;;Depende del caso||It depends;;No sé||Don't know","req":1},{"k":"mc","id":"C23","t":"¿Qué modelo de despliegue sería aceptable?||Which deployment model would be acceptable?","o":"SaaS (nube del proveedor)||SaaS (vendor cloud);;Instalado en nuestra nube (self-hosted)||Installed in our cloud (self-hosted);;On-premises||On-premises;;Híbrido||Hybrid;;Depende del caso||It depends;;No sé||Don't know","req":1},{"k":"cb","id":"C24","t":"¿Qué requisitos regulatorios, de privacidad o de seguridad serían obligatorios? (marca todos los que apliquen)||Which regulatory, privacy or security requirements would be mandatory? (select all that apply)","o":"Residencia de datos en el país o región||Data residency in the country or region;;Acceso de solo lectura a nuestros sistemas||Read-only access to our systems;;Certificaciones del proveedor (SOC 2, ISO 27001)||Vendor certifications (SOC 2, ISO 27001);;Inicio de sesión único (SSO) y control de roles||Single sign-on (SSO) and role-based access;;Registros de auditoría||Audit logs;;Informe de pruebas de penetración del proveedor||Vendor penetration test report;;Evaluación de seguridad de proveedores (due diligence)||Vendor security due diligence;;Ninguno en particular||None in particular;;No sé||Don't know","other":1},{"k":"cb","id":"C25","t":"Si algo así existiera, ¿qué integraciones serían imprescindibles? (hasta 5; no implica que existan hoy)||If something like this existed, which integrations would be essential? (up to 5; this does not imply they exist today)","o":"AWS||AWS;;Azure||Azure;;Google Cloud||Google Cloud;;SIEM (Sentinel, Splunk u otro)||SIEM (Sentinel, Splunk or other);;EDR/XDR||EDR/XDR;;Escáneres de vulnerabilidades||Vulnerability scanners;;CNAPP/CSPM||CNAPP/CSPM;;Proveedor de identidad (Okta, Entra ID)||Identity provider (Okta, Entra ID);;Jira o ServiceNow||Jira or ServiceNow;;Slack o Teams||Slack or Teams;;CI/CD y repositorios||CI/CD and repositories;;Importación por API o CSV||API or CSV import;;Ninguna es imprescindible||None is essential","max":5,"other":1},{"k":"mc","id":"C26","t":"Sobre funciones de IA en una herramienta así, ¿cuál es tu postura?||About AI features in a tool like this, what is your stance?","o":"Las exigiríamos||We would require them;;Las aceptaríamos con control humano y evidencia||We would accept them with human control and evidence;;Solo lectura, sin acciones automáticas||Read-only, no automatic actions;;Preferiríamos una herramienta sin IA||We would prefer a tool without AI;;Nuestra política las prohíbe||Our policy prohibits them;;No sé||Don't know","req":1},{"k":"pg","id":"C27","t":"¿Qué haría que tu organización rechazara de inmediato una herramienta así? (opcional)||What would make your organization reject a tool like this right away? (optional)"}]},{"key":"C5","t":"Tu papel en las compras||Your role in purchasing","q":[{"k":"mc","id":"C28","t":"En compras de herramientas de seguridad, ¿cuál es tu papel principal?||In purchases of security tools, what is your main role?","o":"Usuario/a: la uso a diario||User: I use it daily;;Evaluador/a técnico/a||Technical evaluator;;Influyo o recomiendo||I influence or recommend;;Apruebo presupuesto||I approve the budget;;Decisión final||Final decision-maker;;No participo / No sé||I don't take part / Don't know","req":1,"go":{"5":"C7"}}]},{"key":"C6","t":"Compra y piloto||Purchasing and pilot","d":"Responde solo con lo que sepas; \"No sé\" es válido. El interés declarado no se considera compromiso de compra.||Answer only what you know; \"Don't know\" is valid. Stated interest is not treated as a purchase commitment.","next":"C7","q":[{"k":"cb","id":" function tx(s,l){const p=String(s).split('||');const v=l==='es'?p[0]:(p[1]!==undefined?p[1]:p[0]);return v.replace(/\{\{CONTACT\}\}/g,CONTACT)}
function list(s,l){return String(s).split(';;').map(x=>tx(x,l))}

const KEY={};DEF.sections.forEach((s,i)=>{KEY[s.key]=i});
let idx=0,hist=[],answers={},view='survey',declined=false,lastRec=null,lastContact=null,nextBtn=null;
const mem={};
const K_R='pacifics_'+CODE+'_responses',K_C='pacifics_'+CODE+'_contacts';
function load(k){if(mem[k])return mem[k];try{const v=localStorage.getItem(k);if(v){mem[k]=JSON.parse(v);return mem[k]}}catch(e){}mem[k]=[];return mem[k]}
function save(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const K_S='pacifics_'+CODE+'_sent';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- envío al receptor ---------- */
function post(payload){
 return fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
}
function pendingJobs(){
 const S=new Set(load(K_S)),jobs=[];
 load(K_R).forEach(r=>{if(!S.has(r.id))jobs.push({id:r.id,p:{survey:CODE,responses:[r],contacts:[]}})});
 load(K_C).forEach(c=>{if(!S.has(c.id))jobs.push({id:c.id,p:{survey:CODE,responses:[],contacts:[c]}})});
 return jobs;
}
let flushing=null;
function flushPending(){
 if(!SUBMIT_URL)return Promise.resolve({total:0,failed:0});
 if(flushing)return flushing;
 const jobs=pendingJobs();let failed=0;
 flushing=jobs.reduce((chain,j)=>chain.then(()=>post(j.p).then(()=>{const a=load(K_S);a.push(j.id);save(K_S,a)}).catch(()=>{failed++})),Promise.resolve())
  .then(()=>{flushing=null;return {total:jobs.length,failed:failed}});
 return flushing;
}
function showStatus(res){const el=$('#sendstatus');if(el)el.textContent=res.failed?t('sendFail'):t('sendOk')}

function h(tag,attrs,...kids){
 const e=document.createElement(tag);
 for(const k in (attrs||{})){const v=attrs[k];
  if(k==='class')e.className=v;
  else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
  else if(k==='disabled'||k==='checked')e[k]=!!v;
  else if(v===true)e.setAttribute(k,'');
  else if(v!==false&&v!=null)e.setAttribute(k,v);}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
 return e;
}
const $=s=>document.querySelector(s);

/* ---------- render ---------- */
function render(){
 document.documentElement.lang=lang;
 document.title=tx(DEF.title,lang);
 const app=$('#app');app.replaceChildren();
 if(location.hash==='#admin'){renderAdmin(app);return}
 app.append(topbar());
 if(view==='done'){renderDone(app)}else{renderSection(app)}
 window.scrollTo(0,0);
}
function topbar(){
 const pct=view==='done'?100:Math.min(95,Math.round(hist.length/Math.max(DEF.sections.length-1,1)*100));
 const lb=l=>h('button',{type:'button','aria-pressed':String(lang===l),onclick:()=>{lang=l;try{localStorage.setItem('pacifics_lang',l)}catch(e){}render()}},l.toUpperCase());
 return h('div',null,
  h('div',{class:'top'},h('h1',null,tx(DEF.title,lang)),h('div',{class:'lang'},lb('es'),lb('en'))),
  h('div',{class:'bar',role:'progressbar','aria-valuenow':String(pct),'aria-valuemin':'0','aria-valuemax':'100'},h('i',{style:'width:'+pct+'%'})));

function footer(){
 return h('div',{class:'foot'});
}
function renderSection(app){
 const sec=DEF.sections[idx];
 const card=h('section',{class:'sec'});
 if(idx===0){card.append(h('p',{class:'intro'},tx(DEF.desc,lang)))}
 else{card.append(h('h2',null,tx(sec.t,lang)));if(sec.d)card.append(h('p',{class:'intro'},tx(sec.d,lang)))}
 sec.q.forEach(q=>card.append(renderQ(q)));
 nextBtn=h('button',{class:'btn',type:'button',onclick:goNext},t('next'));
 card.append(h('div',{class:'nav'},h('button',{class:'btn ghost',type:'button',disabled:hist.length===0,onclick:goBack},t('back')),nextBtn));

function refreshNav(){if(nextBtn)nextBtn.textContent=nextIdx(idx).submit?t('submit'):t('next')}
function touch(q){const b=document.querySelector('[data-qid="'+q.id+'"]');if(b){b.classList.remove('bad');const e=b.querySelector('.err');if(e)e.textContent=''}refreshNav()}

function renderQ(q){
 const box=h('div',{class:'q','data-qid':q.id});
 const title=tx(q.t,lang);
 if(q.k==='info'){box.classList.add('info');box.append(h('h3',null,title));if(q.h)box.append(h('p',{class:'help'},tx(q.h,lang)));return box}
 box.append(h('div',{class:'lbl',id:'l_'+q.id},title,q.req?h('span',{class:'star'},' *'):null));
 if(q.h)box.append(h('p',{class:'help'},tx(q.h,lang)));
 const fn={mc:qMC,ls:qLS,cb:qCB,tx:qText,em:qText,pg:qText,sc:qSC,gr:qGR}[q.k];
 box.append(fn(q),h('div',{class:'err',role:'alert'}));
 return box;
}
function qMC(q){
 const L=list(q.o,lang),a=answers[q.id]||{};
 const wrap=h('div',{class:'opts',role:'radiogroup','aria-labelledby':'l_'+q.id});
 let otherIn=null,otherR=null;
 L.forEach((lab,i)=>{
  const r=h('input',{type:'radio',name:q.id,checked:a.i===i});
  r.addEventListener('change',()=>{answers[q.id]={i:i,other:false,text:''};if(otherIn)otherIn.value='';touch(q)});
  wrap.append(h('label',{class:'opt'},r,h('span',null,lab)));
 });
 if(q.other){
  otherR=h('input',{type:'radio',name:q.id,checked:!!a.other});
  otherIn=h('input',{type:'text',class:'oth','aria-label':t('other')});otherIn.value=a.text||'';
  const set=()=>{answers[q.id]={i:null,other:true,text:otherIn.value};touch(q)};
  otherR.addEventListener('change',set);
  otherIn.addEventListener('input',()=>{otherR.checked=true;set()});
  wrap.append(h('label',{class:'opt oo'},otherR,h('span',null,t('other')),otherIn));
 }
 return wrap;
}
function qLS(q){
 const L=list(q.o,lang),a=answers[q.id]||{};
 const s=h('select',{'aria-labelledby':'l_'+q.id},h('option',{value:''},t('choose')),L.map((x,i)=>h('option',{value:String(i)},x)));
 s.value=a.i!=null?String(a.i):'';
 s.addEventListener('change',()=>{answers[q.id]=s.value===''?{i:null,other:false,text:''}:{i:+s.value,other:false,text:''};touch(q)});
 return s;
}
function cbCount(a){return (a.sel||[]).length+(a.other?1:0)}
function qCB(q){
 const L=list(q.o,lang);
 const a=answers[q.id]=answers[q.id]||{sel:[],other:false,text:''};
 const inputs=[];const wrap=h('div',{class:'opts'});
 const applyMax=()=>{if(!q.max)return;const n=cbCount(a);inputs.forEach(x=>{if(!x.checked)x.disabled=n>=q.max;else x.disabled=false})};
 L.forEach((lab,i)=>{
  const c=h('input',{type:'checkbox',checked:a.sel.indexOf(i)>=0});
  c.addEventListener('change',()=>{a.sel=c.checked?a.sel.concat([i]):a.sel.filter(x=>x!==i);applyMax();touch(q)});
  inputs.push(c);wrap.append(h('label',{class:'opt'},c,h('span',null,lab)));
 });
 if(q.other){
  const oc=h('input',{type:'checkbox',checked:!!a.other});
  const oi=h('input',{type:'text',class:'oth','aria-label':t('other')});oi.value=a.text||'';
  oc.addEventListener('change',()=>{a.other=oc.checked;if(!oc.checked){a.text='';oi.value=''}applyMax();touch(q)});
  oi.addEventListener('input',()=>{a.text=oi.value;if(oi.value&&!oc.checked&&!oc.disabled){oc.checked=true;a.other=true;applyMax()}touch(q)});
  inputs.push(oc);wrap.append(h('label',{class:'opt oo'},oc,h('span',null,t('other')),oi));
 }
 applyMax();
 return wrap;
}
function qText(q){
 const inp=q.k==='pg'?h('textarea',{rows:'4'}):h('input',{type:q.k==='em'?'email':'text'});
 inp.value=answers[q.id]||'';inp.setAttribute('aria-labelledby','l_'+q.id);
 inp.addEventListener('input',()=>{answers[q.id]=inp.value;touch(q)});
 return inp;
}
function qSC(q){
 const n=q.n||5,row=h('div',{class:'scale',role:'radiogroup','aria-labelledby':'l_'+q.id});
 for(let v=1;v<=n;v++){
  const r=h('input',{type:'radio',name:q.id,checked:answers[q.id]===v});
  r.addEventListener('change',()=>{answers[q.id]=v;touch(q)});
  row.append(h('label',{class:'sc'},h('span',null,String(v)),r));
 }
 return h('div',null,row,h('div',{class:'scl'},h('span',null,tx(q.lo,lang)),h('span',null,tx(q.hi,lang))));
}
function qGR(q){
 const R=list(q.r,lang),C=list(q.c,lang);
 const a=answers[q.id]=answers[q.id]||{};
 const tb=h('table',{class:'grid'});
 tb.append(h('thead',null,h('tr',null,h('th',null,''),C.map(c=>h('th',null,c)))));
 const body=h('tbody');
 R.forEach((r,ri)=>{
  const tr=h('tr',null,h('th',{scope:'row'},r));
  C.forEach((c,ci)=>{
   const inp=h('input',{type:'radio',name:q.id+'_'+ri,'aria-label':r+' — '+c,checked:a[ri]===ci});
   inp.addEventListener('change',()=>{a[ri]=ci;touch(q)});
   tr.append(h('td',null,inp));
  });
  body.append(tr);
 });
 tb.append(body);
 return h('div',{class:'gridwrap'},tb);

/* ---------- navegación ---------- */
function nextIdx(i){
 const sec=DEF.sections[i];
 for(const q of sec.q){
  if(q.go&&q.k==='mc'){
   const a=answers[q.id];
   if(a&&a.i!=null&&a.i>=0&&q.go[a.i]!==undefined){
    const tg=q.go[a.i];
    if(tg==='SUBMIT')return {submit:true,viaGo:true};
    return {to:KEY[tg]};
   }
  }
 }
 if(sec.next&&KEY[sec.next]!==undefined&&KEY[sec.next]!==i+1)return {to:KEY[sec.next]};
 if(i+1>=DEF.sections.length)return {submit:true};
 return {to:i+1};
}
function isEmpty(q){
 const a=answers[q.id];
 switch(q.k){
  case 'mc':case 'ls':return !a||(a.i==null&&!a.other);
  case 'cb':return !a||((a.sel||[]).length===0&&!a.other);
  case 'gr':return !a||Object.keys(a).length===0;
  case 'sc':return a==null;
  default:return !a||!String(a).trim();
 }
}
function validate(){
 const sec=DEF.sections[idx];let first=null;
 sec.q.forEach(q=>{
  if(q.k==='info')return;
  const box=document.querySelector('[data-qid="'+q.id+'"]');
  const a=answers[q.id];let msg='';
  if(q.req&&isEmpty(q))msg=q.k==='gr'?t('gridRows'):t('req');
  else if(q.k==='gr'&&q.req&&Object.keys(a||{}).length<list(q.r,lang).length)msg=t('gridRows');
  else if((q.k==='mc'||q.k==='cb')&&a&&a.other&&!(a.text||'').trim())msg=t('otherReq');
  else if(q.k==='em'&&a&&String(a).trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(a).trim()))msg=t('email');
  else if(q.k==='cb'&&q.max&&a&&cbCount(a)>q.max)msg=t('atMost')+q.max;
  box.querySelector('.err').textContent=msg;
  box.classList.toggle('bad',!!msg);
  if(msg&&!first)first=box;
 });
 if(first){first.scrollIntoView({behavior:'smooth',block:'center'});return false}
 return true;
}
function goNext(){
 if(!validate())return;
 const n=nextIdx(idx);
 if(n.submit){declined=(idx===0&&!!n.viaGo);submit();return}
 hist.push(idx);idx=n.to;render();
}
function goBack(){if(!hist.length)return;idx=hist.pop();render()}

/* ---------- datos ---------- */
function canon(q){
 const a=answers[q.id];if(a==null)return '';
 switch(q.k){
  case 'mc':case 'ls':{const L=list(q.o,'es');if(a.other)return 'Otro: '+(a.text||'');return a.i!=null&&a.i>=0?L[a.i]:''}
  case 'cb':{const L=list(q.o,'es');const o=(a.sel||[]).slice().sort((x,y)=>x-y).map(i=>L[i]);if(a.other)o.push('Otro: '+(a.text||''));return o.join(' | ')}
  case 'gr':{const R=list(q.r,'es'),C=list(q.c,'es');return R.map((r,i)=>a[i]!=null?r+': '+C[a[i]]:null).filter(Boolean).join(' | ')}
  default:return String(a);
 }
}
function submit(){
 if(declined){view='done';lastRec=null;lastContact=null;render();return}
 const path=hist.concat([idx]);
 const rec={id:uid(),ts:new Date().toISOString(),lang:lang,survey:CODE,answers:{}};
 let contact=null;
 path.forEach(si=>{
  const qs=DEF.sections[si].q;
  qs.forEach(q=>{
   if(q.k==='info')return;
   const v=canon(q);
   if(q.k==='em'){
    if(v.trim()){const cbq=qs.find(x=>x.k==='cb');contact={id:uid(),ts:rec.ts,lang:lang,email:v.trim(),interest:cbq?canon(cbq):''}}
    return;
   }
   rec.answers[q.id]=v;
  });
 });
 const R=load(K_R);R.push(rec);save(K_R,R);
 if(contact){const C=load(K_C);C.push(contact);save(K_C,C)}
 lastRec=rec;lastContact=contact;view='done';render();
 if(SUBMIT_URL)flushPending().then(showStatus);
}
function qIds(){return DEF.sections.flatMap(s=>s.q).filter(q=>q.k!=='info'&&q.k!=='em').map(q=>q.id)}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s)&&isNaN(Number(s)))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function toCSV(rows,header){return '﻿'+[header].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n')}
function respCSV(recs){const ids=qIds();return toCSV(recs.map(r=>[r.id,r.ts,r.lang].concat(ids.map(i=>r.answers[i]||''))),['id','fecha','idioma'].concat(ids))}
function contactsCSV(cs){return toCSV(cs.map(c=>[c.id,c.ts,c.lang,c.email,c.interest]),['id','fecha','idioma','correo','interes'])}
function dictCSV(){
 const rows=[];
 DEF.sections.forEach(s=>s.q.forEach(q=>{
  if(q.k==='info')return;
  const o=(l)=>q.o?list(q.o,l).join(' | '):(q.r?list(q.r,l).join(' | ')+' // '+list(q.c,l).join(' | '):'');
  rows.push([q.id,s.key,q.k,q.req?'Si':'No',tx(q.t,'es'),tx(q.t,'en'),o('es'),o('en')]);
 }));
 return toCSV(rows,['id','seccion','tipo','obligatoria','texto_es','texto_en','opciones_es','opciones_en']);
}
function dl(name,text,type){
 const u=URL.createObjectURL(new Blob([text],{type:type}));
 const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),3000);
}
const fname=(s,e)=>'PACIFICS_'+CODE+'_'+s+'.'+e;

/* ---------- pantallas finales ---------- */
function renderDone(app){
 const card=h('section',{class:'sec'});
 if(declined){card.append(h('h2',null,t('declined')))}
 else{
  card.append(h('h2',null,tx(DEF.confirm,lang)),
   SUBMIT_URL?h('p',{class:'intro',id:'sendstatus',role:'status'},t('sending')):h('p',{class:'intro'},t('localNote')+' '+t('sendNote')+CONTACT+'.'));
  card.append(h('div',{class:'btns'},
   h('button',{class:'btn',type:'button',onclick:()=>dl(fname('mi_respuesta','json'),JSON.stringify({survey:CODE,exported:new Date().toISOString(),responses:[lastRec],contacts:lastContact?[lastContact]:[]},null,1),'application/json')},t('dlJson')),
   h('button',{class:'btn ghost',type:'button',onclick:()=>dl(fname('mi_respuesta','csv'),respCSV([lastRec]),'text/csv;charset=utf-8')},t('dlCsv'))));
 }
 card.append(h('div',{class:'btns'},h('button',{class:'btn ghost',type:'button',onclick:()=>{idx=0;hist=[];answers={};declined=false;view='survey';render()}},t('again'))));
 app.append(card,footer());
}
function renderAdmin(app){
 const R=load(K_R),C=load(K_C);
 const card=h('section',{class:'sec'});
 card.append(h('h2',null,'Administración — Encuesta '+CODE),
  h('p',{class:'intro'},'Los datos están guardados solo en este navegador y dispositivo. Para reunir respuestas de varias personas, pídeles su archivo JSON e impórtalo aquí.'),
  h('table',{class:'adm'},h('tr',null,h('td',null,'Respuestas guardadas'),h('td',null,String(R.length))),h('tr',null,h('td',null,'Contactos (aparte)'),h('td',null,String(C.length))),
   SUBMIT_URL?h('tr',null,h('td',null,'Pendientes de envío'),h('td',null,String(pendingJobs().length))):null));
 const b=(txt,fn,g)=>h('button',{class:'btn'+(g?' ghost':''),type:'button',onclick:fn},txt);
 const fi=h('input',{type:'file',accept:'.json,application/json',multiple:true,style:'display:none'});
 fi.addEventListener('change',()=>importFiles(fi.files));
 card.append(h('div',{class:'btns'},
  b('Descargar respuestas (CSV)',()=>dl(fname('respuestas','csv'),respCSV(R),'text/csv;charset=utf-8')),
  b('Descargar respuestas (JSON)',()=>dl(fname('respuestas','json'),JSON.stringify({survey:CODE,exported:new Date().toISOString(),responses:R,contacts:C},null,1),'application/json'),true),
  b('Descargar contactos (CSV)',()=>dl(fname('contactos','csv'),contactsCSV(C),'text/csv;charset=utf-8'),true),
  b('Descargar diccionario (CSV)',()=>dl(fname('diccionario','csv'),dictCSV(),'text/csv;charset=utf-8'),true)),
  h('div',{class:'btns'},
  SUBMIT_URL?b('Reenviar pendientes',()=>{flushPending().then(r=>{alert(r.failed?('No se pudo enviar '+r.failed+' registro(s).'):'Envío completado.');render()})},true):null,
  b('Importar archivos JSON…',()=>fi.click(),true),fi,
  b('Borrar todo',()=>{if(confirm('¿Borrar todas las respuestas y contactos guardados en este navegador? No se puede deshacer.')){save(K_R,[]);save(K_C,[]);render()}},true),
  b('Volver a la encuesta',()=>{location.hash='';},true)));
 app.append(card);
}
function importFiles(files){
 Promise.all(Array.prototype.map.call(files,f=>f.text())).then(ts=>{
  let n=0;
  ts.forEach(tt=>{try{
   const d=JSON.parse(tt);if(d.survey&&d.survey!==CODE)return;
   const R=load(K_R),C=load(K_C);const ids=new Set(R.map(x=>x.id)),cs=new Set(C.map(x=>x.id));
   (d.responses||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id)){R.push(x);ids.add(x.id);n++}});
   (d.contacts||[]).forEach(x=>{if(x&&x.id&&!cs.has(x.id)){C.push(x);cs.add(x.id)}});
   save(K_R,R);save(K_C,C);
  }catch(e){}});
  alert('Respuestas nuevas importadas: '+n);render();
 });
}
window.addEventListener('hashchange',render);
if(SUBMIT_URL)flushPending();
render();
})();
</script>
