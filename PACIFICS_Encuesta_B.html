<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACIFICS — Encuesta para profesionales y estudiantes de ciberseguridad</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b1f24;--muted:#5b6672;--line:#d6dce3;--accent:#1f5fbf;--accent-t:#fff;--err:#b3261e;--soft:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--card:#181d23;--text:#e8ebef;--muted:#9aa6b2;--line:#2b333c;--accent:#6ea3f0;--accent-t:#0b1626;--err:#ff8a80;--soft:#1e2a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:8px 0 12px}
.top h1{font-size:1.2rem;line-height:1.3;margin:0}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec h2{margin:0 0 8px;font-size:1.15rem}
.intro{white-space:pre-line;color:var(--muted);margin:0 0 16px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q.bad{border-left:3px solid var(--err);padding-left:12px}
.lbl{font-weight:600;margin-bottom:6px}
.star{color:var(--err)}
.help{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.info h3{margin:0 0 4px;font-size:1rem}
.info{background:var(--soft);border-radius:8px;padding:12px 14px;margin:8px 0;border-top:0}
.err{color:var(--err);font-size:.88rem;min-height:0}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt input{margin-top:5px;flex:none}
.opt.oo{align-items:center}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.oth{flex:1;min-width:0;padding:4px 8px!important}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scl{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:4px}
.gridwrap{overflow-x:auto}
.grid{border-collapse:collapse;min-width:100%}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:.88rem;font-weight:400;vertical-align:middle}
.grid th[scope=row]{text-align:left;min-width:200px}
.grid thead th{font-weight:600}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.btn{font:inherit;border:0;background:var(--accent);color:var(--accent-t);padding:10px 22px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:16px;text-align:center}
.foot a{color:var(--muted)}
table.adm{border-collapse:collapse;margin:8px 0}
.adm td{padding:4px 12px 4px 0}
</style>
</head>

<div id="app"></div>

(function(){
"use strict";
const DEF={"title":"PACIFICS — Encuesta para profesionales y estudiantes de ciberseguridad||PACIFICS — Survey for cybersecurity professionals and students","desc":"Estamos investigando cómo las personas que trabajan o estudian en ciberseguridad investigan, priorizan y corrigen hallazgos de seguridad. Nos interesa tu experiencia real, incluidas las partes que funcionan bien. Duración estimada: 8–12 minutos (menos si tu perfil no requiere todas las secciones). La participación es voluntaria: puedes omitir preguntas opcionales y salir cuando quieras. NO escribas datos confidenciales (clientes, IP, credenciales, detalles de incidentes reales). No pedimos tu nombre. Analizaremos las respuestas de forma agregada. Solo si lo aceptas al final, te pediremos un correo para invitarte a una entrevista; se guarda aparte de tus respuestas. Contacto: {{CONTACT}}||We are researching how people who work or study in cybersecurity investigate, prioritize and fix security findings. We are interested in your real experience, including what works well. Estimated time: 8–12 minutes (less if your profile does not require every section). Participation is voluntary: you may skip optional questions and leave at any time. DO NOT write confidential data (clients, IPs, credentials, details of real incidents). We do not ask for your name. Responses are analyzed in aggregate. Only if you agree at the end, we will ask for an email to invite you to an interview; it is stored separately from your answers. Contact: {{CONTACT}}","confirm":"Gracias. Tus respuestas fueron registradas.||Thank you. Your responses have been recorded.","sections":[{"key":"S1","q":[{"k":"mc","id":"B00","t":"¿Tienes 18 años o más y aceptas participar?||Are you 18 or older, and do you agree to take part?","o":"Sí, tengo 18 años o más y acepto participar||Yes, I am 18 or older and I agree to take part;;No||No","req":1,"go":{"1":"SUBMIT"}}]},{"key":"S2","t":"Tu perfil||Your profile","q":[{"k":"ls","id":"B01","t":"¿En qué país resides actualmente?||Which country do you currently live in?","o":"Argentina||Argentina;;Bolivia||Bolivia;;Brasil||Brazil;;Chile||Chile;;Colombia||Colombia;;Costa Rica||Costa Rica;;Cuba||Cuba;;Ecuador||Ecuador;;El Salvador||El Salvador;;Guatemala||Guatemala;;Honduras||Honduras;;México||Mexico;;Nicaragua||Nicaragua;;Panamá||Panama;;Paraguay||Paraguay;;Perú||Peru;;República Dominicana||Dominican Republic;;Uruguay||Uruguay;;Venezuela||Venezuela;;Otro país de América||Other country in the Americas;;Estados Unidos||United States;;Canadá||Canada;;España||Spain;;Reino Unido||United Kingdom;;Alemania||Germany;;Francia||France;;Italia||Italy;;Portugal||Portugal;;Otro país de Europa||Other European country;;India||India;;Otro país de Asia-Pacífico||Other Asia-Pacific country;;África y Medio Oriente||Africa and Middle East;;Prefiero no decir||Prefer not to say","req":1},{"k":"mc","id":"B03","t":"¿Cuántos años de experiencia profesional tienes en ciberseguridad o un área técnica relacionada?||How many years of professional experience do you have in cybersecurity or a related technical field?","o":"Ninguna aún (solo formación o autoestudio)||None yet (education or self-study only);;Menos de 1 año||Less than 1 year;;1–2 años||1–2 years;;3–5 años||3–5 years;;6–10 años||6–10 years;;Más de 10 años||More than 10 years","req":1},{"k":"mc","id":"B06","t":"¿Dónde trabajas principalmente?||Where do you mainly work?","o":"En una organización que usa seguridad para sí misma (equipo interno)||In an organization that runs security for itself (in-house team);;En una consultora de seguridad o TI||At a security or IT consultancy;;En un proveedor de servicios gestionados (MSSP, MDR, SOC como servicio)||At a managed service provider (MSSP, MDR, SOC-as-a-service);;En un fabricante o proveedor de productos de seguridad||At a security product vendor;;Sector público o gobierno||Public sector or government;;Universidad o centro de investigación||University or research center;;Independiente o freelance||Independent or freelance;;No trabajo actualmente||I am not currently working;;Otro||Other"},{"k":"mc","id":"B07","t":"¿Cuántas personas trabajan en tu organización?||How many people work in your organization?","o":"1–10||1–10;;11–50||11–50;;51–200||51–200;;201–1.000||201–1,000;;1.001–5.000||1,001–5,000;;Más de 5.000||More than 5,000;;No sé||Don't know;;Prefiero no decir||Prefer not to say"},{"k":"mc","id":"B08","t":"¿En qué sector está tu organización?||Which sector is your organization in?","o":"Financiero y seguros||Financial services and insurance;;Salud||Healthcare;;Gobierno||Government;;Tecnología y software||Technology and software;;Telecomunicaciones||Telecommunications;;Comercio y e-commerce||Retail and e-commerce;;Manufactura y energía||Manufacturing and energy;;Educación||Education;;Servicios profesionales||Professional services;;Otro||Other;;Prefiero no decir||Prefer not to say"},{"k":"mc","id":"B09","t":"¿Cómo llegaste a esta encuesta?||How did you find this survey?","o":"LinkedIn||LinkedIn;;Comunidad en línea (Discord, Slack, Telegram, Reddit…)||Online community (Discord, Slack, Telegram, Reddit…);;Mi universidad o institución||My university or institution;;Un colega o contacto||A colleague or contact;;Evento o conferencia||Event or conference;;Newsletter o medio especializado||Newsletter or specialist media;;Otro||Other;;Prefiero no decir||Prefer not to say"},{"k":"mc","id":"B02","t":"¿Cuál describe mejor tu situación actual?||Which best describes your current situation?","o":"Trabajo en ciberseguridad, TI, desarrollo o cloud||I work in cybersecurity, IT, development or cloud;;Soy estudiante y además trabajo en TI o ciberseguridad||I am a student and also work in IT or cybersecurity;;Estoy entre empleos o en transición hacia el área||I am between jobs or transitioning into the field;;Soy estudiante o autodidacta y no trabajo en el área||I am a student or self-learner and do not work in the field","req":1,"go":{"3":"SS"}}]},{"key":"S3","t":"Herramientas it by name;;No lo conozco||Not familiar with it"},{"k":"cb","id":"B11","t":"¿Cuáles de estos productos o enfoques usas actualmente (trabajo o laboratorio)? (marca todos los que apliquen)||Which of these products or approaches do you currently use (work or lab)? (select all that apply)","o":"Microsoft Sentinel||Microsoft Sentinel;;Splunk||Splunk;;CrowdStrike||CrowdStrike;;Palo Alto Networks||Palo Alto Networks;;Wiz||Wiz;;Orca Security||Orca Security;;Tenable||Tenable;;Qualys||Qualys;;Wazuh||Wazuh;;Servicios nativos de AWS||AWS native services;;Servicios nativos de Azure||Azure native services;;Servicios nativos de Google Cloud||Google Cloud native services;;Herramientas open source de seguridad cloud o de grafos||Open-source cloud security or graph tools;;Scripts o consultas propias||In-house scripts or queries;;Hojas de cálculo||Spreadsheets;;Ninguno de estos||None of these","other":1,"h":"Ejemplos, no es una lista completa.||Examples; not a complete list."},{"k":"gr","id":"B12","t":"Tu experiencia con cada proveedor cloud||Your experience with each cloud provider","req":1,"r":"Amazon Web Services (AWS)||Amazon Web Services (AWS);;Microsoft Azure||Microsoft Azure;;Google Cloud||Google Cloud","c":"Lo uso en producción||Use it in production;;Lo he usado en laboratorio o proyecto||Used it in a lab or project;;Lo he estudiado (cursos o teoría)||Studied it (courses or theory);;No estoy familiarizado/a||Not familiar"},{"k":"gr","id":"B13","t":"Tu experiencia práctica con estos temas cloud (si no aplica, elige la última columna)||Your hands-on experience with these cloud topics (if not applicable, choose the last column)","r":"IAM, roles, permisos y mínimo privilegio||IAM, roles, permissions and least privilege;;Redes y reglas de acceso (p. ej., security groups)||Networking and access rules (e.g., security groups);;Almacenamiento y datos sensibles||Storage and sensitive data;;Vulnerabilidades y malas configuraciones en cloud||Cloud vulnerabilities and misconfigurations;;Servicios nativos de seguridad del proveedor||Provider-native security services;;Entornos multi-cloud||Multi-cloud environments;;Rutas de ataque en cloud||Cloud attack paths","c":"Lo trabajo en producción||Work with it in production;;Lo he practicado en laboratorio||Practiced it in a lab;;Lo he estudiado||Studied it;;No lo he trabajado||Have not worked with it"}]},{"key":"S4","t":"Tu trabajo hoy||Your work today","d":"Responde pensando en situaciones reales, sin datos confidenciales.||Answer thinking of real situations, without confidential data.","q":[{"k":"mc","id":"B15","t":"Piensa en los últimos 6 meses. ¿Cuál fue la situación más reciente en la que tuviste que decidir qué hallazgo de seguridad investigar o corregir primero?||Think of the last 6 months. What was the most recent situation in which you had to decide which security finding to investigate or fix first?","o":"Una alerta o incidente de seguridad||A security alert or incident;;El resultado de un escaneo de vulnerabilidades||A vulnerability scan result;;Un hallazgo de auditoría o prueba de penetración||An audit or penetration test finding;;Una revisión de configuración o postura en la nube||A cloud configuration or posture review;;Una solicitud de otra área o de la dirección||A request from another team or management;;No he tenido una situación así en los últimos 6 meses||I have not had such a situation in the last 6 months","other":1,"req":1},{"k":"mc","id":"B17","t":"Para esa situación, ¿cuánto tiempo pasó desde que apareció el hallazgo hasta tener una decisión clara?||For that situation, how long passed from the finding appearing to a clear decision?","o":"Menos de 15 min||Under 15 min;;15–60 min||15–60 min;;1–4 h||1–4 h;;4–8 h (una jornada)||4–8 h (a workday);;1–3 días||1–3 days;;Más de 3 días||More than 3 days;;No lo recuerdo / no aplica||I don't remember / not applicable","req":1},{"k":"gr","id":"B18","t":"¿Con qué frecuencia te ocurre cada situación en tu trabajo?||How often does each situation happen in your work?","req":1,"r":"Cambiar entre varias consolas o herramientas para investigar un mismo caso||Switching between several consoles or tools to investigate one case;;Correlacionar manualmente hallazgos de distintas fuentes||Manually correlating findings from different sources;;Decidir qué vulnerabilidades corregir primero cuando hay un volumen muy alto||Deciding which vulnerabilities to fix first when volume is very high;;Determinar si un hallazgo es realmente explotable o alcanzable en mi entorno||Determining whether a finding is really exploitable or reachable in my environment;;Entender relaciones entre recursos cloud, identidades y permisos||Understanding relationships between cloud resources, identities and permissions;;Explicar a otras personas el impacto de negocio de un hallazgo||Explaining the business impact of a finding to others;;Recibir alertas en exceso o de baja calidad (falsos positivos)||Receiving excessive or low-quality alerts (false positives);;No tener personal o presupuesto para atender los hallazgos||Lacking staff or budget to address findings;;Usar herramientas que no se integran entre sí||Using tools that do not integrate with each other;;Confirmar que una corrección realmente eliminó el riesgo||Confirming that a fix really removed the risk","c":"Todos los días||Every day;;Semanalmente||Weekly;;Mensualmente||Monthly;;Algunas veces al año||A few times a year;;Nunca||Never;;No aplica a mi rol||Not applicable to my role"},{"k":"mc","id":"B19","t":"De las situaciones anteriores, ¿cuál te consume más tiempo?||Of the situations above, which one consumes the most of your time?","o":"Cambiar entre consolas o herramientas||Switching between consoles or tools;;Correlacionar hallazgos manualmente||Manually correlating findings;;Priorizar vulnerabilidades por volumen||Prioritizing vulnerabilities due to volume;;Saber si algo es explotable o alcanzable||Knowing whether something is exploitable or reachable;;Entender relaciones cloud-identidades-permisos||Understanding cloud-identity-permission relationships;;Explicar impacto de negocio||Explaining business impact;;Alertas en exceso o falsos positivos||Excess alerts or false positives;;Falta de personal o presupuesto||Lack of staff or budget;;Falta de integración entre herramientas||Lack of integration between tools;;Confirmar que una corrección funcionó||Confirming that a fix worked;;Ninguna destaca||None stands out","other":1},{"k":"mc","id":"B20","t":"Para esa situación, ¿cuántas horas por semana dedicas, aproximadamente?||For that situation, roughly how many hours per week do you spend?","o":"Menos de 1||Less than 1;;1–3||1–3;;4–8||4–8;;9–15||9–15;;Más de 15||More than 15;;No sé||Don't know"},{"k":"cb","id":"B21","t":"¿Qué consecuencias ha tenido? (marca todas las que apliquen)||What consequences has it had? (select all that apply)","o":"Demoras en corregir||Delays in fixing;;Riesgos detectados tarde||Risks detected late;;Retrabajo o esfuerzo duplicado||Rework or duplicated effort;;Desgaste o rotación del equipo||Team burnout or turnover;;Costos adicionales en herramientas o consultoría||Extra tooling or consulting costs;;Hallazgos sin atender||Findings left unaddressed;;Hallazgos críticos que pasaron inadvertidos||Critical findings that went unnoticed;;No ha habido consecuencias importantes||No significant consequences;;No sé||Don't know","other":1},{"k":"cb","id":"B22","t":"¿Cómo lo manejas hoy? (marca todas las que apliquen)||How do you handle it today? (select all that apply)","o":"Funciones de mis plataformas actuales||Features of my current platforms;;Herramienta comercial específica||A specific commercial tool;;Herramientas open source||Open-source tools;;Scripts o consultas propias||In-house scripts or queries;;Hojas de cálculo o documentos||Spreadsheets or documents;;Reuniones o consultas a otras personas||Meetings or asking other people;;Proceso manual repetido||A repeated manual process;;No hay solución; lo toleramos||No solution; we live with it","other":1},{"k":"pg","id":"B23","t":"¿Hay otro problema de seguridad que te consuma tiempo y no apareció aquí? (opcional)||Is there another security problem that takes your time and did not appear here? (optional)"}]},{"key":"S5","t":"Tu rol||Your role","d":"Esto nos permite mostrarte las preguntas más relevantes.||This lets us show you the most relevant questions.","q":[{"k":"mc","id":"B04","t":"¿Cuál describe mejor tu rol principal actual?||Which best describes your current primary role?","o":"SOC / Blue Team||SOC / Blue Team;;Respuesta a incidentes / DFIR||Incident response / DFIR;;Threat hunting / inteligencia de amenazas||Threat hunting / threat intelligence;;Gestión de vulnerabilidades||Vulnerability management;;Seguridad cloud||Cloud security;;Ingeniería de seguridad||Security engineering;;Arquitectura de seguridad||Security architecture;;Pentesting / hacking ético||Penetration testing / ethical hacking;;Red Team / seguridad ofensiva||Red team / offensive security;;DevSecOps / seguridad de aplicaciones||DevSecOps / application security;;GRC / ISO 27001 / gestión de seguridad de la información||GRC / ISO 27001 / information security management;;Gerencia de seguridad / CISO||Security management / CISO;;Operaciones TI / NOC / infraestructura||IT operations / NOC / infrastructure;;Otro||Other;;No estoy seguro/a||Not sure","req":1,"go":{"0":"MD","1":"MD","2":"MD","3":"MV","4":"MC","5":"MC","6":"MC","7":"MO","8":"MO","9":"S6","10":"MG","11":"MG","12":"S6","13":"S6","14":"S6"}}]},{"key":"MD","t":"Operación defensiva||Defensive operations","next":"S6","q":[{"k":"mc","id":"B26","t":"¿Cuántas alertas revisas personalmente en un día laboral típico?||How many alerts do you personally review on a typical workday?","o":"Menos de 10||Fewer than 10;;10–50||10–50;;51–200||51–200;;201–1.000||201–1,000;;Más de 1.000||More than 1,000;;Varía demasiado / no lo sé||Varies too much / don't know;;No aplica||Not applicable","req":1},{"k":"mc","id":"B27","t":"De las alertas que function post(payload){

}
function pendingJobs(){
 const S=new Set(load(K_S)),jobs=[];
 load(K_R).forEach(r=>{if(!S.has(r.id))jobs.push({id:r.id,p:{survey:CODE,responses:[r],contacts:[]}})});
 load(K_C).forEach(c=>{if(!S.has(c.id))jobs.push({id:c.id,p:{survey:CODE,responses:[],contacts:[c]}})});
 return jobs;
}
let flushing=null;
function flushPending(){
 if(!SUBMIT_URL)return Promise.resolve({total:0,failed:0});
 if(flushing)return flushing;
 const jobs=pendingJobs();let failed=0;
 flushing=jobs.reduce((chain,j)=>chain.then(()=>post(j.p).then(()=>{const a=load(K_S);a.push(j.id);save(K_S,a)}).catch(()=>{failed++})),Promise.resolve())
  .then(()=>{flushing=null;return {total:jobs.length,failed:failed}});
 return flushing;
}

function h(tag,attrs,...kids){
 const e=document.createElement(tag);
 for(const k in (attrs||{})){const v=attrs[k];
  if(k==='class')e.className=v;
  else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
  else if(k==='disabled'||k==='checked')e[k]=!!v;
  else if(v===true)e.setAttribute(k,'');
  else if(v!==false&&v!=null)e.setAttribute(k,v);}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
 return e;
}

  else if((q.k==='mc'||q.k==='cb')&&a&&a.other&&!(a.text||'').trim())msg=t('otherReq');
  else if(q.k==='em'&&a&&String(a).trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(a).trim()))msg=t('email');
  else if(q.k==='cb'&&q.max&&a&&cbCount(a)>q.max)msg=t('atMost')+q.max;

function canon(q){
 const a=answers[q.id];if(a==null)return '';
 switch(q.k){
  case 'mc':case 'ls':{const L=list(q.o,'es');if(a.other)return 'Otro: '+(a.text||'');return a.i!=null&&a.i>=0?L[a.i]:''}
  case 'cb':{const L=list(q.o,'es');const o=(a.sel||[]).slice().sort((x,y)=>x-y).map(i=>L[i]);if(a.other)o.push('Otro: '+(a.text||''));return o.join(' | ')}
  case 'gr':{const R=list(q.r,'es'),C=list(q.c,'es');return R.map((r,i)=>a[i]!=null?r+': '+C[a[i]]:null).filter(Boolean).join(' | ')}
  default:return String(a);
 }
}

   const v=canon(q);
   if(q.k==='em'){
    if(v.trim()){const cbq=qs.find(x=>x.k==='cb');contact={id:uid(),ts:rec.ts,lang:lang,email:v.trim(),interest:cbq?canon(cbq):''}}
    return;
   }
   rec.answers[q.id]=v;
  });
 });
 const R=load(K_R);R.push(rec);save(K_R,R);
 if(contact){const C=load(K_C);C.push(contact);save(K_C,C)}
 lastRec=rec;lastContact=contact;view='done';render();
 if(SUBMIT_URL)flushPending().then(showStatus);
}
function qIds(){return DEF.sections.flatMap(s=>s.q).filter(q=>q.k!=='info'&&q.k!=='em').map(q=>q.id)}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s)&&isNaN(Number(s)))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function toCSV(rows,header){return '﻿'+[header].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n')}
function respCSV(recs){const ids=qIds();return toCSV(recs.map(r=>[r.id,r.ts,r.lang].concat(ids.map(i=>r.answers[i]||''))),['id','fecha','idioma'].concat(ids))}
function contactsCSV(cs){return toCSV(cs.map(c=>[c.id,c.ts,c.lang,c.email,c.interest]),['id','fecha','idioma','correo','interes'])}
function dictCSV(){
 const rows=[];
 DEF.sections.forEach(s=>s.q.forEach(q=>{
  if(q.k==='info')return;
  const o=(l)=>q.o?list(q.o,l).join(' | '):(q.r?list(q.r,l).join(' | ')+' // '+list(q.c,l).join(' | '):'');
  rows.push([q.id,s.key,q.k,q.req?'Si':'No',tx(q.t,'es'),tx(q.t,'en'),o('es'),o('en')]);
 }));
 return toCSV(rows,['id','seccion','tipo','obligatoria','texto_es','texto_en','opciones_es','opciones_en']);
}
function dl(name,text,type){
 const u=URL.createObjectURL(new Blob([text],{type:type}));
 const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),3000);
}
const fname=(s,e)=>'PACIFICS_'+CODE+'_'+s+'.'+e;

/* ---------- pantallas finales ---------- */
function renderDone(app){
 const card=h('section',{class:'sec'});
 if(declined){card.append(h('h2',null,t('declined')))}
 else{
  card.append(h('h2',null,tx(DEF.confirm,lang)),
   SUBMIT_URL?h('p',{class:'intro',id:'sendstatus',role:'status'},t('sending')):h('p',{class:'intro'},t('localNote')+' '+t('sendNote')+CONTACT+'.'));
  card.append(h('div',{class:'btns'},
   h('button',{class:'btn',type:'button',onclick:()=>dl(fname('mi_respuesta','json'),JSON.stringify({survey:CODE,exported:new Date().toISOString(),responses:[lastRec],contacts:lastContact?[lastContact]:[]},null,1),'application/json')},t('dlJson')),
   h('button',{class:'btn ghost',type:'button',onclick:()=>dl(fname('mi_respuesta','csv'),respCSV([lastRec]),'text/csv;charset=utf-8')},t('dlCsv'))));
 }
 card.append(h('div',{class:'btns'},h('button',{class:'btn ghost',type:'button',onclick:()=>{idx=0;hist=[];answers={};declined=false;view='survey';render()}},t('again'))));
 app.append(card,footer());
}
function renderAdmin(app){
 const R=load(K_R),C=load(K_C);
 const card=h('section',{class:'sec'});
 card.append(h('h2',null,'Administración — Encuesta '+CODE),
  h('p',{class:'intro'},'Los datos están guardados solo en este navegador y dispositivo. Para reunir respuestas de varias personas, pídeles su archivo JSON e impórtalo aquí.'),
  h('table',{class:'adm'},h('tr',null,h('td',null,'Respuestas guardadas'),h('td',null,String(R.length))),h('tr',null,h('td',null,'Contactos (aparte)'),h('td',null,String(C.length))),
   SUBMIT_URL?h('tr',null,h('td',null,'Pendientes de envío'),h('td',null,String(pendingJobs().length))):null));
 const b=(txt,fn,g)=>h('button',{class:'btn'+(g?' ghost':''),type:'button',onclick:fn},txt);
 const fi=h('input',{type:'file',accept:'.json,application/json',multiple:true,style:'display:none'});
 fi.addEventListener('change',()=>importFiles(fi.files));
 card.append(h('div',{class:'btns'},
  b('Descargar respuestas (CSV)',()=>dl(fname('respuestas','csv'),respCSV(R),'text/csv;charset=utf-8')),
  b('Descargar respuestas (JSON)',()=>dl(fname('respuestas','json'),JSON.stringify({survey:CODE,exported:new Date().toISOString(),responses:R,contacts:C},null,1),'application/json'),true),
  b('Descargar contactos (CSV)',()=>dl(fname('contactos','csv'),contactsCSV(C),'text/csv;charset=utf-8'),true),
  b('Descargar diccionario (CSV)',()=>dl(fname('diccionario','csv'),dictCSV(),'text/csv;charset=utf-8'),true)),
  h('div',{class:'btns'},
  SUBMIT_URL?b('Reenviar pendientes',()=>{flushPending().then(r=>{alert(r.failed?('No se pudo enviar '+r.failed+' registro(s).'):'Envío completado.');render()})},true):null,
  b('Importar archivos JSON…',()=>fi.click(),true),fi,
  b('Borrar todo',()=>{if(confirm('¿Borrar todas las respuestas y contactos guardados en este navegador? No se puede deshacer.')){save(K_R,[]);save(K_C,[]);render()}},true),
  b('Volver a la encuesta',()=>{location.hash='';},true)));
 app.append(card);
}
function importFiles(files){
 Promise.all(Array.prototype.map.call(files,f=>f.text())).then(ts=>{
  let n=0;
  ts.forEach(tt=>{try{
   const d=JSON.parse(tt);if(d.survey&&d.survey!==CODE)return;
   const R=load(K_R),C=load(K_C);const ids=new Set(R.map(x=>x.id)),cs=new Set(C.map(x=>x.id));
   (d.responses||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id)){R.push(x);ids.add(x.id);n++}});
   (d.contacts||[]).forEach(x=>{if(x&&x.id&&!cs.has(x.id)){C.push(x);cs.add(x.id)}});
   save(K_R,R);save(K_C,C);
  }catch(e){}});
  alert('Respuestas nuevas importadas: '+n);render();
 });
}
window.addEventListener('hashchange',render);
if(SUBMIT_URL)flushPending();
render();
})();
</script>
